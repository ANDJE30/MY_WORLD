# Production sur un serveur (VPS Oracle Cloud Always Free, OVH, Contabo, serveur de l'établissement…)
# Usage : DOMAIN=schoolx.ai721.cm SUPERADMIN_PASSWORD='MotDePasseFort!2026' VAULT_KEY=$(openssl rand -hex 32) docker compose up -d --build
# Conservez VAULT_KEY en lieu sûr : elle chiffre le coffre des accès (mots de passe générés).
services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      - TRUST_PROXY=1
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD:-}
      - VAULT_KEY=${VAULT_KEY:-}
    volumes:
      - edugest-data:/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]
volumes:
  edugest-data:
  caddy-data:
