# Blueprint Render — SVTC Répétitions (service web + base PostgreSQL, offre gratuite, région Francfort).
# Render ▸ New ▸ Blueprint ▸ dépôt ANDJE30/MY_WORLD ▸ Blueprint Path : svtc/render.yaml
# Adresse publique : https://svtc-tutoring.onrender.com (Render ajoute un suffixe si le nom est déjà pris).
services:
  - type: web
    name: svtc-tutoring
    runtime: node
    plan: free
    region: frankfurt
    rootDir: svtc
    # Construction économe en mémoire (webpack, un seul processus) adaptée aux 512 Mo de l'offre gratuite.
    # npm run build applique d'abord les migrations de la base, puis construit l'application.
    buildCommand: npm ci && LOW_MEMORY_BUILD=1 NODE_OPTIONS=--max-old-space-size=384 npm run build -- --webpack
    startCommand: NODE_OPTIONS=--max-old-space-size=320 node_modules/.bin/next start
    healthCheckPath: /connexion
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: svtc-tutoring-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false # saisi dans Render à la création (mot de passe initial du compte « admin »)
      - key: APP_URL
        value: https://svtc-tutoring.onrender.com
      - key: SMS_PROVIDER
        value: SIMULATION

databases:
  - name: svtc-tutoring-db
    plan: free
    region: frankfurt
    databaseName: svtc
    user: svtc
    postgresMajorVersion: "16"
